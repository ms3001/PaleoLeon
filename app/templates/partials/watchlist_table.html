<div id="watchlist">

  <div class="watchlist-header">
    <label class="scope-label">
      <span>Scope</span>
      <select name="scope"
              hx-post="/watchlist/scope"
              hx-trigger="change"
              hx-include="this"
              hx-target="#watchlist"
              hx-swap="outerHTML">
        <option value="all" {% if scope == 'all' %}selected{% endif %}>All accounts</option>
        {% for a in accounts %}
        <option value="{{ a.account }}" {% if scope == a.account %}selected{% endif %}>
          {{ a.account }}
        </option>
        {% endfor %}
      </select>
    </label>
    <small class="muted">Updated {{ taken_at | dt }} · refreshes every {{ refresh_seconds }}s</small>
  </div>

  {% include "partials/watchlist_rows.html" %}

  <div class="search-box">
    <input type="search" name="q"
           placeholder="Type a symbol you own&hellip;"
           autocomplete="off"
           hx-get="/watchlist/search"
           hx-trigger="input changed delay:200ms, focus"
           hx-target="#search-results"
           hx-swap="innerHTML">
    <div id="search-results"></div>
  </div>
</div>
