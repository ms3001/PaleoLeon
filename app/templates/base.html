<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PaleoLeon{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%231f9d55'/><text x='50%25' y='66%25' text-anchor='middle' font-size='42' font-family='monospace' font-weight='700' fill='white'>P</text></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="/static/app.css">
  <script src="https://unpkg.com/htmx.org@2.0.3" defer></script>
</head>
<body>
  <header class="container">
    <nav>
      <ul><li><strong><a href="/" class="contrast">PaleoLeon</a></strong></li></ul>
    </nav>
    {% if not connected %}
    <article class="banner-warn">
      <strong>Disconnected from IB.</strong>
      Start IB Gateway / TWS and enable API access on port {{ ib_port }}.
      {% if ib_error %}<br><small>{{ ib_error }}</small>{% endif %}
    </article>
    {% endif %}
  </header>
  <main class="container">
    {% block body %}{% endblock %}
  </main>
</body>
</html>
